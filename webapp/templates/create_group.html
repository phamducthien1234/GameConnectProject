<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='gaco_logo.png') }}"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('index') }}"
        >
            🎮 GameConnect
        </a>

        <div>

            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-outline-light"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('profile') }}"
                class="btn btn-outline-light"
            >
                Profile
            </a>

            <a
                href="{{ url_for('logout') }}"
                class="btn btn-danger"
            >
                Logout
            </a>

        </div>

    </div>

</nav>


{% with messages = get_flashed_messages() %}

    {% if messages %}

        <div class="flash-container">

            {% for message in messages %}

                <div class="flash-message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Create Group
                    </h2>

                    <form
                        method="POST"
                        action="{{ url_for('create_group') }}"
                    >

                        <div class="mb-3">

                            <label
                                for="group_name"
                                class="form-label"
                            >
                                Group Name
                            </label>

                            <input
                                type="text"
                                id="group_name"
                                name="group_name"
                                class="form-control"
                                placeholder="Enter group name"
                                maxlength="100"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="game_id"
                                class="form-label"
                            >
                                Game
                            </label>

                            <select
                                id="game_id"
                                name="game_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    -- Select Game --
                                </option>

                                {% for game in games %}

                                <option value="{{ game.game_id }}">
                                    {{ game.game_name }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Create Group
                            </button>

                            <a
                                href="{{ url_for('groups') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='js/notification.js') }}"></script>

</body>

</html>
