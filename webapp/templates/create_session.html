<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='gaco_logo.png') }}"
    >

</head>


<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('index') }}"
        >
            🎮 GameConnect
        </a>

        <a
            href="{{ url_for('sessions') }}"
            class="btn btn-outline-light"
        >
            Gaming Sessions
        </a>

    </div>

</nav>


<div class="container mt-5">

    <h1>Create Gaming Session</h1>

    <p class="text-muted">
        Schedule a gaming session with one of your groups.
    </p>


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Group
            </label>

            <select
                name="group_id"
                class="form-select"
                required
            >

                <option value="">
                    -- Select Group --
                </option>

                {% for group in groups %}

                <option
                    value="{{ group.group_id }}"
                    {% if selected_group_id == group.group_id %}
                        selected
                    {% endif %}
                >

                    {{ group.group_name }}

                </option>

                {% endfor %}

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Session Name
            </label>

            <input
                type="text"
                name="session_name"
                class="form-control"
                placeholder="Friday Valorant Session"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Date and Time
            </label>

            <input
                type="datetime-local"
                name="session_time"
                class="form-control"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea
                name="description"
                class="form-control"
                rows="4"
                placeholder="Ranked games, 5v5..."
            ></textarea>

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Create Session
        </button>

        <a
            href="{{ url_for('sessions') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

</body>

</html>
