<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Group - GameConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('index') }}"
        >
            🎮 GameConnect
        </a>

    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2 class="mb-4">
                Edit Group
            </h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Group Name
                    </label>

                    <input
                        type="text"
                        name="group_name"
                        class="form-control"
                        value="{{ group.group_name }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Game
                    </label>

                    <select
                        name="game_id"
                        class="form-select"
                        required
                    >

                        {% for game in games %}

                        <option
                            value="{{ game.game_id }}"
                            {% if game.game_id == group.game_id %}
                                selected
                            {% endif %}
                        >
                            {{ game.game_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for(
                        'group_details',
                        group_id=group.group_id
                    ) }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/notification.js') }}"></script>

</body>
</html>
