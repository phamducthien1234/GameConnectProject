<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('index') }}"
        >
            🎮 GameConnect
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Add a Game
                    </h2>


                    {% with messages = get_flashed_messages() %}

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-info">
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label">
                                Game
                            </label>

                            <select
                                name="game_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select a game
                                </option>

                                {% for game in games %}

                                    <option
                                        value="{{ game.game_id }}"
                                    >
                                        {{ game.game_name }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Rank
                            </label>

                            <input
                                type="text"
                                name="rank"
                                class="form-control"
                                placeholder="e.g. Diamond"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Role
                            </label>

                            <input
                                type="text"
                                name="role"
                                class="form-control"
                                placeholder="e.g. Duelist, Support, ADC"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Availability
                            </label>

                            <input
                                type="text"
                                name="availability"
                                class="form-control"
                                placeholder="e.g. Friday evening"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Add Game
                        </button>


                        <a
                            href="/profile"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>
</html>
