<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game Deals - GameConnect</title>

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='gaco_logo.png') }}"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('index') }}"
        >
            🎮 GameConnect
        </a>

        <div>
            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-outline-light"
            >
                Dashboard
            </a>
            
            <a
                href="{{ url_for('profile') }}"
                class="btn btn-outline-light"
            >
                Profile
            </a>

            <a
                href="{{ url_for('logout') }}"
                class="btn btn-danger"
            >
                Logout
            </a>
        </div>

    </div>
</nav>

{% with messages = get_flashed_messages() %}

    {% if messages %}

        <div class="flash-container">

            {% for message in messages %}

                <div class="flash-message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}


<div class="container mt-4">

    <h2>Game Deals</h2>

    <p class="text-muted">
        Search for current PC game prices and deals.
    </p>


    <div class="input-group mb-4">

        <input
            type="text"
            id="gameSearch"
            class="form-control"
            placeholder="Search for a game..."
        >

        <button
            type="button"
            id="searchButton"
            class="btn btn-primary"
        >
            Search
        </button>

    </div>


    <div
        id="loading"
        class="text-center d-none"
    >

        <div
            class="spinner-border"
            role="status"
        ></div>

        <p>Searching ...</p>

    </div>


    <!-- Results -->
    <div
        id="results"
        class="row"
    ></div>
    
    <div class="mt-4 mb-5">

        <a
            href="{{ url_for('dashboard') }}"
            class="btn btn-secondary"
        >
            Back to Dashboard
        </a>

    </div>
</div>


<script src="{{ url_for('static', filename='js/notifications.js') }}"></script>


<script src="{{ url_for('static', filename='js/game_deals.js') }}"></script>


</body>

</html>
